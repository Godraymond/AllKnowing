
# Builds Windows, macOS and Linux installers, then publishes them as a GitHub
# release named after the version in package.json (v<version>). Bump the version
# before running this for a new release; installed apps update from these releases.
name: Build installers

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install bundled FFmpeg binary
        run: node node_modules/ffmpeg-static/install.js

      - name: Verify bundled FFmpeg binary
        run: |
          node -e "const fs=require('node:fs'); const ffmpeg=require('ffmpeg-static'); if (typeof ffmpeg !== 'string' || !fs.existsSync(ffmpeg)) { throw new Error('Bundled ffmpeg-static binary is missing: ' + ffmpeg); } console.log('Using bundled ffmpeg binary: ' + ffmpeg);"

      - name: Install app dependencies
        run: npx electron-builder install-app-deps

      - name: Build Windows app
        shell: pwsh
        run: |
          npm run build:platform-native-helpers
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx tsc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx vite build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx electron-builder --win dir nsis --x64 --publish never

      - name: Smoke test packaged Windows paths
        run: npm run smoke:packaged-binaries

      - name: Generate Windows artifact checksums
        run: npm run checksums:release -- SHA256SUMS-windows.txt

      - name: Attest Windows artifacts
        uses: actions/attest@v4
        with:
          subject-checksums: release/SHA256SUMS-windows.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-release
          path: |
            release/*.exe
            release/*.blockmap
            release/latest*.yml
            release/SHA256SUMS*.txt
          if-no-files-found: error
          retention-days: 30

  build-macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            arch_tag: darwin-x64
            runner: macos-15-intel
          - arch: arm64
            arch_tag: darwin-arm64
            runner: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install bundled FFmpeg binary
        run: node node_modules/ffmpeg-static/install.js

      - name: Verify bundled FFmpeg binary
        run: |
          node -e "const fs=require('node:fs'); const ffmpeg=require('ffmpeg-static'); if (typeof ffmpeg !== 'string' || !fs.existsSync(ffmpeg)) { throw new Error('Bundled ffmpeg-static binary is missing: ' + ffmpeg); } console.log('Using bundled ffmpeg binary: ' + ffmpeg);"

      - name: Install app dependencies
        run: npx electron-builder install-app-deps

      - name: Build macOS app
        run: |
          npm run build:platform-native-helpers
          npx tsc
          npx vite build
          npx electron-builder --mac dir dmg zip --${{ matrix.arch }} --publish never

      - name: Smoke test packaged macOS paths
        env:
          PACKAGED_SMOKE_ARCH_TAGS: ${{ matrix.arch_tag }}
        run: npm run smoke:packaged-binaries

      - name: Generate macOS artifact checksums
        run: npm run checksums:release -- SHA256SUMS-macos-${{ matrix.arch }}.txt

      - name: Attest macOS artifacts
        uses: actions/attest@v4
        with:
          subject-checksums: release/SHA256SUMS-macos-${{ matrix.arch }}.txt

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-release
          path: |
            release/**/*.dmg
            release/**/*.zip
            release/**/*.blockmap
            release/latest-mac.yml
            release/SHA256SUMS*.txt
          if-no-files-found: error
          retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install bundled FFmpeg binary
        run: node node_modules/ffmpeg-static/install.js

      - name: Verify bundled FFmpeg binary
        run: |
          node -e "const fs=require('node:fs'); const ffmpeg=require('ffmpeg-static'); if (typeof ffmpeg !== 'string' || !fs.existsSync(ffmpeg)) { throw new Error('Bundled ffmpeg-static binary is missing: ' + ffmpeg); } console.log('Using bundled ffmpeg binary: ' + ffmpeg);"

      - name: Install Linux native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxt-dev libxtst-dev libxkbfile-dev libxi-dev libxrandr-dev libxinerama-dev

      - name: Remove stale uiohook build output
        run: rm -rf node_modules/uiohook-napi/build

      - name: Install app dependencies
        run: npx electron-builder install-app-deps

      - name: Build Linux app
        run: |
          npm run build:platform-native-helpers
          npx tsc
          npx vite build
          npx electron-builder --linux dir AppImage --x64 --publish never

      - name: Smoke test packaged Linux paths
        run: npm run smoke:packaged-binaries

      - name: Generate Linux artifact checksums
        run: npm run checksums:release -- SHA256SUMS-linux.txt

      - name: Attest Linux artifacts
        uses: actions/attest@v4
        with:
          subject-checksums: release/SHA256SUMS-linux.txt

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-release
          path: |
            release/**/*.AppImage
            release/**/*.blockmap
            release/latest-linux.yml
            release/SHA256SUMS*.txt
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub release
    needs:
      - build-windows
      - build-macos
      - build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: python -m pip install pyyaml

      # Each macOS job writes its own latest-mac.yml; merge them so the update
      # feed lists both the Intel and Apple Silicon builds.
      - name: Merge macOS update metadata
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import yaml

          x64_info = yaml.safe_load(Path('artifacts/macos-x64-release/latest-mac.yml').read_text())
          arm64_info = yaml.safe_load(Path('artifacts/macos-arm64-release/latest-mac.yml').read_text())

          merged_files = []
          seen_urls = set()
          for info in (x64_info, arm64_info):
            for file_info in info.get('files', []):
              url = file_info.get('url')
              if url and url not in seen_urls:
                seen_urls.add(url)
                merged_files.append(file_info)

          if not merged_files:
            raise SystemExit('No macOS update files found to merge.')

          preferred = next((item for item in merged_files if 'x64' in item.get('url', '')), merged_files[0])
          merged = dict(x64_info)
          merged['files'] = merged_files
          merged['path'] = preferred.get('url', merged.get('path'))
          merged['sha512'] = preferred.get('sha512', merged.get('sha512'))
          if not merged.get('releaseDate') and arm64_info.get('releaseDate'):
            merged['releaseDate'] = arm64_info['releaseDate']

          Path('artifacts/latest-mac.yml').write_text(yaml.safe_dump(merged, sort_keys=False))
          PY

      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload
          find artifacts -name '*.app' -prune -o -type f \( \
            -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' \
            -o -name '*.blockmap' -o -name 'SHA256SUMS*.txt' \
            -o -name 'latest.yml' -o -name 'latest-linux.yml' \
          \) -print0 | xargs -0 -I{} cp {} upload/
          cp artifacts/latest-mac.yml upload/latest-mac.yml
          ls -la upload

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(jq -r .version package.json)"
          tag="v${version}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)"
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "::error::Release $tag already exists for an older commit. Bump the version in package.json, push, and run this again."
              exit 1
            fi
            gh release upload "$tag" upload/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" upload/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Recordly $version" \
              --notes "Unsigned build from ${GITHUB_SHA::7}. Windows: if SmartScreen warns, click More info, then Run anyway. macOS: if it says the app is damaged or can't be opened, run \`xattr -cr /Applications/Recordly.app\` in Terminal."
          fi
