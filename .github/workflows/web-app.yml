name: Web app

# Builds the AllKnowing web app (assistant/dist) and puts it on the gh-pages branch, where the Mac mini's
# installer and its updates fetch it from (version.json lists every file with its SHA-256).
# GitHub Pages serves that branch once it is switched on:
#   Settings → Pages → Source "Deploy from a branch" → Branch "gh-pages", folder "/ (root)".
# Until then this still runs and passes; the branch just isn't served anywhere.

on:
  push:
    branches: [main]
    paths:
      - "assistant/**"
      - ".github/workflows/web-app.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-app
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Check the web app's runtime
        run: node assistant/check-web-runtime.cjs

      - name: Check key quotes are held to the transcript
        run: node assistant/check-quotes.cjs

      - name: Check the Mac mini's server
        run: node assistant/check-hub.cjs

      - name: Check recordings turned into text
        run: node assistant/check-recordings.cjs

      - name: Check recordings turned into text on the Mac itself
        run: node assistant/check-speech.cjs

      - name: Check the Mac relay
        run: node assistant/check-relay.cjs

      - name: Check the Mac installers
        run: bash -n assistant/hub/install.sh && bash -n assistant/relay/install.sh

      - name: Build
        run: node assistant/build-web.cjs "$(date -u +%Y-%m-%d).${GITHUB_SHA::7}"

      - name: Publish to the gh-pages branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        working-directory: assistant/dist
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Web app ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
