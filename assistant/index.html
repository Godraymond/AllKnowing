<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AllKnowing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Sans+SC:wght@400;600;700&display=swap">
<style>
:root {
  /* AllKnowing: a live meeting cockpit. Transcript left, what-to-say and the picture centre, details right. */
  --bg: #f3f4f6;
  --surface: #ffffff;
  --surface-2: #eef0f3;
  --ink: #14171c;
  --muted: #5d6571;
  --line: #dfe2e7;
  --accent: #2346d4;
  --accent-ink: #ffffff;
  --accent-soft: #e7ebfc;
  --live: #d9333a;
  --good: #1e8449;
  --warn: #9a6200;
  --bad: #c33b2f;
  --c1: #4338ca; --c1-bg: #eef0ff;
  --c2: #0b7a91; --c2-bg: #e5f5f9;
  --c3: #557a12; --c3-bg: #f0f6e2;
  --c4: #9a5b00; --c4-bg: #fff3dc;
  --bulb: #e0a400;
  --font-display: "Bricolage Grotesque", "Source Sans 3", system-ui, sans-serif;
  --font-body: "Source Sans 3", "Noto Sans SC", "PingFang SC", "PingFang TC", "Microsoft YaHei", "Microsoft JhengHei", system-ui, sans-serif;
  --radius: 12px;
  --shadow: 0 1px 2px rgb(20 23 28 / 0.06), 0 4px 16px rgb(20 23 28 / 0.05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1014; --surface: #161a20; --surface-2: #1e232a; --ink: #e8ebef; --muted: #9aa3ae; --line: #2a3038;
    --accent: #7189ff; --accent-ink: #0d1014; --accent-soft: #1d2546;
    --live: #ff5c62; --good: #45c078; --warn: #e3a94a; --bad: #f06a5d;
    --c1: #aab4ff; --c1-bg: #1d2042; --c2: #62d2e8; --c2-bg: #0e2a31; --c3: #b4d66a; --c3-bg: #1e2a10; --c4: #f4c261; --c4-bg: #2d220d;
    --bulb: #f4c430;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1014; --surface: #161a20; --surface-2: #1e232a; --ink: #e8ebef; --muted: #9aa3ae; --line: #2a3038;
  --accent: #7189ff; --accent-ink: #0d1014; --accent-soft: #1d2546;
  --live: #ff5c62; --good: #45c078; --warn: #e3a94a; --bad: #f06a5d;
  --c1: #aab4ff; --c1-bg: #1d2042; --c2: #62d2e8; --c2-bg: #0e2a31; --c3: #b4d66a; --c3-bg: #1e2a10; --c4: #f4c261; --c4-bg: #2d220d;
  --bulb: #f4c430;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.2; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { flex: none; }

/* top bar */
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; padding: 10px 20px; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 9px; font-family: var(--font-display); font-weight: 800; font-size: 19px; letter-spacing: -0.01em; }
.brand-mark { width: 28px; height: 28px; }
.bm-bg { fill: var(--accent); }
.bm-fg { stroke: var(--accent-ink); }
.bm-dot { fill: var(--accent-ink); }
.nav { display: flex; gap: 2px; flex-wrap: wrap; }
.nav button { border: 0; background: transparent; padding: 7px 12px; border-radius: 8px; color: var(--muted); font-weight: 600; cursor: pointer; }
.nav button:hover:not(:disabled) { color: var(--ink); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav button:disabled { opacity: .4; cursor: default; }
.current { margin-left: auto; display: flex; align-items: center; gap: 8px; min-width: 0; }
.current-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 34ch; }

/* building blocks */
main { padding: 20px; max-width: 1480px; margin: 0 auto; }
.view[hidden] { display: none !important; }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.space { justify-content: space-between; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; line-height: 1.2; }
.btn svg { width: 18px; height: 18px; }
.btn:hover:not(:disabled) { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.live { background: var(--live); border-color: var(--live); color: #fff; }
.btn.small { padding: 5px 10px; font-size: 13px; border-radius: 7px; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover:not(:disabled) { color: var(--ink); border-color: var(--line); }
.btn.big { padding: 11px 18px; font-size: 16px; border-radius: 11px; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.card-head h2 { font-size: 16px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small-text { font-size: 13px; }
.empty { color: var(--muted); font-style: italic; margin: 6px 0; }
.sub { font-family: var(--font-body); font-size: 14px; font-weight: 700; margin: 14px 0 4px; }
.plain-list { margin: 4px 0 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14.5px; }
.md p { margin: 0 0 8px; }
.md p:last-child { margin-bottom: 0; }
.md ul, .md ol { margin: 0 0 8px; padding-left: 20px; display: grid; gap: 3px; }
.md h4 { font-family: var(--font-body); font-size: 14px; margin: 8px 0 4px; }
.status-line { font-size: 13px; color: var(--muted); min-height: 1.4em; }
.status-line.bad { color: var(--bad); }
.status-line.ok { color: var(--good); }
.status-line.busy::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: 6px; animation: pulse 1.2s ease-in-out infinite; }

/* forms */
.form { display: grid; gap: 12px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > label, .field > .label { font-size: 13px; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea, .inp { width: 100%; padding: 9px 11px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); }
.field textarea { min-height: 110px; resize: vertical; line-height: 1.45; }
.field .hint { font-size: 12.5px; color: var(--muted); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
.files { display: grid; gap: 6px; }
.file-chip { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 10px; border: 1px dashed var(--line); border-radius: 8px; font-size: 13.5px; }

/* home */
.hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.hero h1 { font-size: clamp(26px, 3.2vw, 36px); font-weight: 800; letter-spacing: -0.02em; }
.hero p { margin: 6px 0 0; color: var(--muted); max-width: 62ch; }
.home-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.mrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 10px 2px; border-top: 1px solid var(--line); }
.mrow:first-child { border-top: 0; }
.mtitle { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
.mtitle:hover { color: var(--accent); }
.mode-badge { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.mstatus { font-size: 12.5px; color: var(--muted); white-space: nowrap; }

/* prep */
.prep-grid { display: grid; grid-template-columns: minmax(340px, 0.9fr) minmax(0, 1.1fr); gap: 20px; align-items: start; }
.plan { display: grid; gap: 12px; }
.plan-sec h3 { font-family: var(--font-body); font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.plan-hero { font-size: 17px; font-weight: 600; }
.agenda { width: 100%; border-collapse: collapse; font-size: 14px; }
.agenda td, .agenda th { text-align: left; padding: 6px 8px; border-top: 1px solid var(--line); vertical-align: top; }
.agenda th { font-size: 12px; color: var(--muted); font-weight: 700; border-top: 0; }
.agenda .min { font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--muted); }
.qa { display: grid; gap: 8px; }
.qa div { border-left: 3px solid var(--line); padding-left: 10px; }
.quote { font-size: 16px; padding: 10px 14px; border-radius: 10px; background: var(--accent-soft); }

/* live */
.live-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 16px; }
.live-bar .spacer { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pill.on { background: color-mix(in srgb, var(--live) 15%, transparent); color: var(--live); }
.pill.on .dot { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.clock { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 18px; min-width: 4.5ch; }
.select-sm { padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 13.5px; max-width: 190px; }
.live-grid { display: grid; grid-template-columns: minmax(260px, 1fr) minmax(340px, 1.35fr) minmax(260px, 1fr); gap: 16px; align-items: start; }
.transcript { height: min(60vh, 640px); overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; overscroll-behavior: contain; }
.seg { font-size: 14.5px; line-height: 1.45; }
.seg .meta { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 6px; }
.seg .sp { font-weight: 700; margin-right: 6px; }
.seg .sp.unsure { color: var(--muted); }
.seg button.sp.voice { border: 0; background: none; padding: 0; font: inherit; font-weight: 700; color: inherit; cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
.seg button.sp.voice.unsure { color: var(--muted); }
.seg.note { color: var(--warn); }
.seg.event { text-align: center; color: var(--muted); font-size: 12.5px; font-weight: 700; letter-spacing: .04em; padding: 2px 0; }
.partial { color: var(--muted); font-style: italic; min-height: 1.2em; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 600; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip.me { border-color: var(--accent); color: var(--accent); }
.chip.me[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.chips-label { font-size: 12px; color: var(--muted); font-weight: 600; width: 100%; }
.composer { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px; margin-top: 10px; }
.composer select, .composer input { padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); min-width: 0; }
.say { border: 2px solid var(--accent); }
.say-now { background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
.say-opt { padding: 10px 0; border-top: 1px dashed var(--line); }
.say-opt:first-child { border-top: 0; padding-top: 0; }
.say-label { font-size: 12px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; }
.say-line { font-size: 17px; line-height: 1.5; margin: 4px 0; }
.say-why { font-size: 13px; color: var(--muted); flex: 1; min-width: 12ch; }
.stage { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.situation { font-size: 15.5px; margin: 8px 0 0; }
.watch { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.watch li { border-left: 3px solid var(--warn); padding: 5px 10px; background: color-mix(in srgb, var(--warn) 11%, transparent); border-radius: 0 8px 8px 0; font-size: 14px; }
.topics { display: grid; gap: 12px; }
.topic h3 { font-family: var(--font-body); font-size: 14.5px; font-weight: 700; }
.banner { padding: 10px 14px; border-radius: 10px; background: color-mix(in srgb, var(--warn) 13%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warn) 40%, var(--line)); display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 12px; font-size: 14px; }

/* visual summary */
.vs { display: grid; gap: 14px; }
.vs-label { justify-self: start; font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; background: var(--surface-2); color: var(--muted); }
.vs-title { font-family: var(--font-body); font-weight: 700; font-size: 22px; letter-spacing: -0.01em; }
.vs-core { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 12px; background: var(--surface-2); border-radius: 12px; padding: 14px 16px; }
.vs-core-head { display: flex; align-items: center; gap: 6px; font-weight: 700; white-space: nowrap; }
.vs-core-head svg { width: 18px; height: 18px; color: var(--bulb); }
.vs-core ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.vs-sub { font-weight: 700; font-size: 17px; }
.vs-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.vs-card { border-radius: 12px; padding: 6px; background: var(--k-bg); display: flex; flex-direction: column; }
.vs-card header { display: flex; align-items: center; gap: 8px; padding: 8px 10px 10px; color: var(--k); font-weight: 700; font-size: 15.5px; }
.vs-card header svg { width: 18px; height: 18px; }
.vs-card-body { background: var(--surface); border-radius: 9px; padding: 12px 14px; flex: 1; }
.vs-card-sub { font-weight: 700; margin: 0 0 8px; padding-bottom: 8px; border-bottom: 1px dashed var(--line); }
.vs-card ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14px; }
.vs-card.k1 { --k: var(--c1); --k-bg: var(--c1-bg); }
.vs-card.k2 { --k: var(--c2); --k-bg: var(--c2-bg); }
.vs-card.k3 { --k: var(--c3); --k-bg: var(--c3-bg); }
.vs-card.k4 { --k: var(--c4); --k-bg: var(--c4-bg); }
.vs-foot { justify-self: end; font-size: 12px; color: var(--muted); }

/* minutes and follow-ups */
.after-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.span-2 { grid-column: 1 / -1; }
.actions-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.actions-table td, .actions-table th { text-align: left; padding: 7px 8px; border-top: 1px solid var(--line); vertical-align: top; }
.actions-table th { font-size: 12px; color: var(--muted); font-weight: 700; border-top: 0; }
.prio { font-size: 11px; font-weight: 800; color: var(--bad); text-transform: uppercase; letter-spacing: .06em; margin-left: 6px; }
pre.email { white-space: pre-wrap; font: inherit; margin: 0; background: var(--surface-2); padding: 12px 14px; border-radius: 10px; }
details > summary { cursor: pointer; font-weight: 700; }
.todo { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 2px; border-top: 1px solid var(--line); }
.todo input[type="checkbox"] { width: 18px; height: 18px; margin-top: 3px; }
.todo.done .todo-task { text-decoration: line-through; color: var(--muted); }
.todo-meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); align-items: center; margin-top: 2px; }
.todo-meta input[type="date"] { padding: 2px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-size: 12.5px; }
.due-bad { color: var(--bad); font-weight: 700; }
.group-title { margin: 16px 0 2px; }
.add-todo { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; }
.drop { border: 2px dashed var(--line); border-radius: 12px; padding: 18px; text-align: center; display: grid; gap: 8px; justify-items: center; background: var(--surface-2); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop p { margin: 0; }
.media-help { border-left: 3px solid var(--accent); padding: 10px 14px; background: var(--accent-soft); border-radius: 0 10px 10px 0; display: grid; gap: 6px; font-size: 14px; }
.media-help ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.stat-row { display: flex; gap: 8px; flex-wrap: wrap; }
.stat { font-size: 13px; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-weight: 600; }
.preview-lines { display: grid; gap: 6px; max-height: 420px; overflow: auto; padding-right: 4px; }
.meter { height: 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.meter > span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s ease; }

/* modal and toasts */
.overlay { position: fixed; inset: 0; background: rgb(10 12 16 / .45); display: grid; place-items: center; padding: 16px; z-index: 50; }
.modal { width: min(580px, 100%); max-height: calc(100% - 32px); overflow: auto; background: var(--surface); border-radius: 14px; border: 1px solid var(--line); padding: 18px; box-shadow: 0 20px 60px rgb(0 0 0 / .3); display: grid; gap: 12px; }
.modal h2 { font-size: 18px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.ev-list { display: grid; gap: 6px; max-height: 50vh; overflow: auto; }
.ev { display: grid; gap: 2px; text-align: left; padding: 9px 11px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.ev:hover { border-color: var(--accent); }
.ev .when { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
#toasts { position: fixed; right: 16px; bottom: 16px; display: grid; gap: 8px; z-index: 60; max-width: min(440px, calc(100% - 32px)); pointer-events: none; }
.toast { background: var(--ink); color: var(--surface); padding: 10px 14px; border-radius: 10px; font-size: 14px; box-shadow: var(--shadow); }
.toast.warn { background: var(--warn); color: #fff; }
.toast.bad { background: var(--bad); color: #fff; }
.toast.good { background: var(--good); color: #fff; }

@media (max-width: 1180px) {
  .live-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .col-detail { grid-column: 1 / -1; }
}
@media (max-width: 900px) {
  .home-grid, .prep-grid, .after-grid { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 760px) {
  main { padding: 14px; }
  .topbar { padding: 8px 14px; gap: 8px; }
  .current { margin-left: 0; width: 100%; }
  .live-grid { grid-template-columns: minmax(0, 1fr); }
  .col-assist { order: -1; }
  .transcript { height: 46vh; }
  .two, .three { grid-template-columns: minmax(0, 1fr); }
  .vs-core { grid-template-columns: minmax(0, 1fr); }
  .mrow { grid-template-columns: auto minmax(0, 1fr) auto; }
  .mrow .mstatus { display: none; }
}
@media (pointer: coarse) {

// Writes a meeting exactly as it came (its own dates included), transcript and all.

  const parts = [];
  for (let p = 0; p * PART_SIZE < m.segs.length; p++) parts.push(m.segs.slice(p * PART_SIZE, (p + 1) * PART_SIZE));
  m.partCount = parts.length;

    for (let p = 0; p < parts.length; p++) { const pr = ref.collection("parts").doc(pid(p)); await serial(pr.path, () => pr.set({ segs: parts[p] })); }
    await serial(ref.path, () => ref.set(data));

function askImportNotes(notes, name) {
  if (isListening()) { toast("Stop listening before bringing in notes.", "warn"); return; }
  const games = notes.meetings.filter((m) => m.mode === "werewolf").length;
  const n = notes.meetings.length - games;
  const meta = [notes.from.replace(/^Saved /, "saved "), notes.at ? fmtDate(notes.at) : ""].filter(Boolean).join(", ");
  const status = h("p", { class: "status-line" });
  const go2 = h("button", { type: "button", class: "btn primary" }, "Bring them in");
  const md2 = modal("Bring in notes?", h("div", { class: "stack" },
    h("p", null, `${name} has ${plural(n, "meeting")} and ${plural(notes.todos.length, "follow-up")}${meta ? ` (${meta})` : ""}.`),
    h("p", { class: "muted small-text" }, `Meetings already here stay as they are, unless the file has a newer copy.${games === 1 ? " 1 old 狼人杀 game comes along too but stays hidden." : games ? ` ${games} old 狼人杀 games come along too but stay hidden.` : ""}`),
    status), [h("button", { type: "button", class: "btn", onclick: () => md2.close() }, "Cancel"), go2]);
  go2.addEventListener("click", async () => {
    go2.disabled = true;
    status.className = "status-line busy";
    let added = 0, kept = 0, todos = 0;
    try {
      await flushSaves();
      const have = new Map((await allIndex()).map((x) => [x.id, x]));
      for (const m of notes.meetings) {
        const old = have.get(m.id);
        if (old && (Number(old.updatedAt) || 0) >= (Number(m.updatedAt) || 0)) { kept++; continue; }
        status.textContent = `Bringing in ${added + kept + 1} of ${notes.meetings.length}…`;
        await writeMeetingAsIs(m);
        added++;
        if (state.cur && state.cur.id === m.id) { state.cur = await loadMeeting(m.id); resetLiveRuntime(); }
      }
      const haveTodos = new Map((await allTodos()).map((t) => [t.id, t]));
      for (const t of notes.todos) {
        const old = haveTodos.get(t.id);
        if (old && (Number(old.updatedAt) || 0) >= (Number(t.updatedAt) || 0)) continue;
        if (P.mode === "db") { const ref = P.todoCol.doc(t.id); await serial(ref.path, () => ref.set(clone(t))); }

    renderCurrentBox();

}

    try {
      const o = JSON.parse(b.text);
      if (Array.isArray(o)) o.forEach((x) => { if (x && x.subject) out.push(x); });
      else if (o && o.subject) out.push(o);

  dismissed: "You closed the permission question. Tap Start to be asked again.",

  renderRecordingChip();
  renderImportPreview();
  let job;
  try {
    job = await cap.transcribe.send(rec.file, {
      language: speechLang(imp.lang),
      terms: namesIn(imp.attendees),
      topic: [imp.title, imp.goal].filter(Boolean).join(". ").slice(0, 300),
      signal: rec.stop.signal,
      onProgress: (sent) => { rec.sent = sent; showRecProgress(); },
    });
  } catch (e) {
    rec.busy = false;
    const byUser = rec.stop.signal.aborted;
    toast(byUser ? "Stopped. Nothing went to Soniox." : (e && (e.userMessage || e.message)) || "Couldn't get the recording to your Mac mini.", byUser ? "" : "bad", 7000);
    if (state.imp === imp && state.route === "import") { renderRecordingChip(); renderImportPreview(); }
    return;
  }
  const when = imp.when ? new Date(imp.when) : new Date();
  const startedAt = Number.isNaN(when.getTime()) ? Date.now() : when.getTime();
  const now = Date.now();
  const seconds = rec.seconds || Number(job && job.duration) || 0;
  const m = normalizeMeeting({
    id: uid(), mode: "meeting",
    title: imp.title.trim() || `Recording ${new Date(startedAt).toLocaleDateString()}`,
    createdAt: now, updatedAt: now, status: "transcribing", startedAt, endedAt: seconds ? startedAt + Math.round(seconds * 1000) : null,
    source: "import", sourceName: rec.name.slice(0, 200), recSeconds: seconds,
    job: { id: job.id, minutes: !!writeMinutes, at: now },
    prep: { attendees: imp.attendees, goal: imp.goal, lang: imp.lang, when: fmtDate(startedAt) },
  });
  if (state.imp === imp) state.imp = freshImport();
  // Somewhere else by now (or listening to another meeting): it goes on the list without taking over.
  if (isListening() || state.route !== "import") {
    const dirty = state.dirtyMeeting;
    await saveMeeting(m);
    state.dirtyMeeting = state.dirtyMeeting || dirty;
    toast(`“${titleOf(m)}” is with your Mac mini. Open it from your list to see the transcript.`, "good", 7000);
    if (state.route === "import") renderImport();
    return;
  }
  await flushSaves();
  state.cur = m;
  resetLiveRuntime();
  await saveMeeting(m);
  safeLocalSet("lastMeeting", m.id);
  state.job = { m, st: job, watching: false };
  go("after");
}
function renderImportPreview() {
  const box = $("#impPreview");
  if (!box) return;
  if (state.imp && state.imp.rec && cap.transcribe) { renderRecordingPanel(box, state.imp); return; }
  const p = state.imp && state.imp.parsed;
  box.replaceChildren(h("div", { class: "card-head" }, h("h2", null, "Preview")));
  if (!p || !p.segs.length) {
    box.append(h("p", { class: "empty" }, cap.transcribe
      ? "Add a recording and your Mac mini turns it into text. Or add a transcript and you'll see what AllKnowing found here: lines, speakers and length. Either way you get minutes, follow-ups and calendar holds."
      : "Add a transcript and you'll see what AllKnowing found here: lines, speakers and length. Then import it for minutes, follow-ups and calendar holds."));
    return;
  }
  box.append(h("div", { class: "stat-row" },
    h("span", { class: "stat" }, plural(p.segs.length, "line")),
    h("span", { class: "stat" }, p.speakers.length ? plural(p.speakers.length, "speaker") : "No speaker names"),
    p.duration ? h("span", { class: "stat" }, "about " + fmtDuration(p.duration)) : null,
    h("span", { class: "stat" }, `${Math.max(1, Math.round(p.chars / 1000))}k characters`)));
  if (p.speakers.length) box.append(h("p", { class: "muted small-text", style: "margin:0" }, "Speakers: " + p.speakers.slice(0, 12).join(", ")));
  if (p.bytes > MINUTES_TRANSCRIPT_BYTES) box.append(h("div", { class: "banner" }, "This is a very long transcript. The minutes will cover the later part in full and may miss detail from the start."));
  box.append(h("div", { class: "preview-lines" }, p.segs.slice(0, 40).map(segEl), p.segs.length > 40 ? h("p", { class: "muted small-text" }, `…and ${p.segs.length - 40} more lines`) : null));
  box.append(h("div", { class: "row" },
    h("button", { type: "button", class: "btn primary", onclick: () => doImport(true) }, "Import and write the minutes"),
    h("button", { type: "button", class: "btn", onclick: () => doImport(false) }, "Import only")));
}
async function doImport(writeMinutes) {
  const imp = state.imp;
  const p = imp && imp.parsed;
  if (!p || !p.segs.length) { toast("Add a transcript first: a file, pasted text or a Teams meeting.", "warn"); return; }
  if (isListening()) { toast("Stop listening before importing.", "warn"); return; }
  await flushSaves();
  const when = imp.when ? new Date(imp.when) : new Date();
  const startedAt = Number.isNaN(when.getTime()) ? Date.now() : when.getTime();
  const now = Date.now();
  const names = imp.files.map((f) => f.name).concat(imp.text.trim() ? ["pasted text"] : []);
  const m = normalizeMeeting({
    id: uid(), mode: "meeting",
    title: imp.title.trim() || `Imported meeting ${new Date(startedAt).toLocaleDateString()}`,
    createdAt: now, updatedAt: now, status: "done", startedAt, endedAt: startedAt + Math.round(p.duration * 1000),
    source: "import", sourceName: imp.source === "teams" ? "a Teams transcript" : names.join(", ").slice(0, 200),
    prep: { attendees: imp.attendees, goal: imp.goal, lang: imp.lang, when: fmtDate(startedAt) },
  });
  m.segs = p.segs.map((s) => ({ ...s }));
  state.cur = m;
  resetLiveRuntime();
  markSegDirty(0);
  await saveSegs(m);
  await saveMeeting(m);
  safeLocalSet("lastMeeting", m.id);
  state.imp = freshImport();
  go("after");
  if (writeMinutes) generateMinutes();
  else toast("Imported. Write the minutes whenever you're ready.", "good");
}
function allText(res) {
  if (!res) return "";
  const parts = arr(res.content, 500).map((b) => (b && typeof b.text === "string" ? b.text : b && b.resource && typeof b.resource.text === "string" ? b.resource.text : "")).filter(Boolean);
  if (parts.length) return parts.join("\n");
  return typeof res.payload === "string" ? res.payload : res.payload ? JSON.stringify(res.payload) : "";
}
function openTeamsPicker() {
  if (!cap.mcp) { toast("Outlook isn't available here. Open AllKnowing in claude.ai with the Microsoft 365 connector added.", "warn", 7000); return; }
  const list = h("div", { class: "ev-list" }, h("p", { class: "empty" }, "Loading your meetings from the last 30 days…"));
  const status = h("p", { class: "status-line" });
  const md2 = modal("Import a Teams meeting transcript", h("div", { class: "stack" },
    h("p", { class: "muted small-text", style: "margin:0" }, "Works for Teams meetings that had transcription switched on."), list, status),
    [h("button", { type: "button", class: "btn", onclick: () => md2.close() }, "Close")]);
  async function fetchTranscript(ev) {
    status.className = "status-line busy";
    status.textContent = "Getting the transcript…";
    try {
      const evRes = await cap.mcp.callTool(SERVER, "read_resource", { uri: ev.uri || `calendar:///events/${ev.id}` });
      const found = allText(evRes).replace(/\\\//g, "/").match(/meeting-transcript:\/\/\/[^\s"'<>\\]+/);
      if (!found) { status.className = "status-line bad"; status.textContent = "This meeting has no Teams transcript. Transcription has to be switched on during the Teams call."; return; }
      const tRes = await cap.mcp.callTool(SERVER, "read_resource", { uri: found[0] });
      const text = allText(tRes);
      if (!text.trim()) { status.className = "status-line bad"; status.textContent = "The transcript came back empty."; return; }
      const imp = state.imp;
      imp.files.push({ name: `Teams · ${ev.subject || "meeting"}`, text: text.slice(0, 4000000) });
      if (!imp.title) imp.title = ev.subject || "";
      const d = evDate(ev.start);
      if (d) { imp.when = localDT(d); imp.whenSet = true; }
      const att = attendeesText(ev);
      if (att && !imp.attendees) imp.attendees = att;
      imp.source = "teams";
      reparseImport();
      md2.close();
      renderImport();
      showPreviewOnPhone();
      toast("Teams transcript added.", "good");
    } catch (e) {
      status.className = "status-line bad";
      status.textContent = mcpErrorText(e);
    }
  }
  (async () => {
    try {
      const res = await cap.mcp.callTool(SERVER, "outlook_calendar_search", { query: "*", afterDateTime: "30 days ago", beforeDateTime: "now", order: "newest", limit: 25 });
      const evs = eventsFromResult(res);
      list.replaceChildren();
      if (!evs.length) { list.append(h("p", { class: "empty" }, "No meetings in the last 30 days.")); return; }
      for (const ev of evs) {
        const d = evDate(ev.start);
        list.append(h("button", { type: "button", class: "ev", onclick: () => fetchTranscript(ev) },
          h("span", { class: "when" }, d ? d.toLocaleString([], { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : ""),
          h("strong", null, ev.subject || "(no subject)")));
      }
    } catch (e) { list.replaceChildren(h("p", { class: "status-line bad" }, mcpErrorText(e))); }
  })();
}

/* ---------- boot ---------- */
function wireNav() {
  for (const b of $$(".nav button")) b.addEventListener("click", () => go(b.dataset.route));
  window.addEventListener("hashchange", () => { const r = location.hash.slice(1); if (ROUTES.includes(r) && r !== state.route) go(r); });
}
let started = false;
function start(hotData) {
  if (started) return;
  started = true;
  wireNav();
  go("home");
  init(obj(hotData)).catch((e) => { console.error(e); toast("Something went wrong while loading. Reload the page.", "bad", 8000); });
}
async function init(hotData) {
  await initCaps();
  if (!window.claude) setBanner("Open AllKnowing in claude.ai to use listening, Claude and Outlook. Here it only keeps notes in this browser.");
  else if (window.claude.notice) setBanner(hostNotice());
  window.addEventListener("allknowing:notice", (e) => setBanner(esc(e.detail || "")));
  bindDictation();
  if (cap.sample) { try { const lim = await cap.sample.limits(); state.imagesOK = !!(lim && lim.images); } catch { state.imagesOK = false; } }
  await initStore();
  await loadSettings();
  subscribeLists();
  const want = hotData.meetingId || safeLocalGet("lastMeeting");
  if (want) {
    try { const m = await loadMeeting(want); if (m && m.mode !== "werewolf") { state.cur = m; resetLiveRuntime(); } } catch (e) { console.warn(e); }
  }
  state.booted = true;
  const fromHash = location.hash.slice(1);
  const r = hotData.route || (ROUTES.includes(fromHash) ? fromHash : "home");
  go(state.cur || !["prep", "live", "after"].includes(r) ? r : "home");
}
const hot = window.claude && window.claude.hot;
try { if (hot && hot.snapshot) hot.snapshot(() => ({ route: state.route, meetingId: state.cur ? state.cur.id : null })); } catch { /* ignore */ }
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
